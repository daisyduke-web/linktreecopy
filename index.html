<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Axis Migration Lawyers</title>

  <!-- Load Lora font -->
  <link href="https://fonts.googleapis.com/css2?family=Lora&display=swap" rel="stylesheet">
  <!-- load montserrat font -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
 

  <!-- Load Font Awesome for icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: 'Montserrat', serif;
    background: linear-gradient(-45deg, #0d1548, #1a237e, #3949ab, #0d1548);
    background-size: 400% 400%;
    animation: gradientBG 20s ease infinite;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  @keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

.container {
  width: 90%;
  max-width: 400px;
  background: rgba(255, 255, 255, 0.05);
  padding: 20px 15px; /* reduced from 30px 20px */
  border-radius: 16px;
  backdrop-filter: blur(8px);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  text-align: center;
}


 .logo img {
  width: 80%; /* take up 80% of the container width */
  max-width: 300px; /* optional limit */
  height: auto;
  display: block;
  margin: 0 auto 10px auto;
  object-fit: contain;
  filter: brightness(0) invert(1);
  vertical-align: middle;
}


  h1 {
    margin-bottom: 30px;
    font-size: 22px;
    color: #ffffff;
  }

  .link-button {
    position: relative;
    background: white;
    color: #1a237e;
    text-decoration: none;
    padding: 12px 20px;
    margin: 10px 0;
    width: 100%;
    min-height: 55px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.4s ease;
    overflow: hidden;
    border: 1px solid rgba(0, 0, 0, 0.08);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
  }

  .link-button i {
    position: absolute;
    left: 20px;
    font-size: 20px;
    color: #1a237e;
    transition: color 0.4s ease;
  }

  .link-button:hover {
    background: #0d1548;
    color: white;
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(26, 35, 126, 0.6), 0 0 20px rgba(26, 35, 126, 0.4);
  }

  .link-button:hover i {
    color: white;
  }

  /* === MOBILE FRIENDLY FIX === */
  @media (max-width: 480px) {
    .container {
      padding: 20px 15px;
      max-width: 90%;
    }

    .logo img {
      width: 160px; /* Smaller logo for phones */
    }

    h1 {
      font-size: 20px;
    }

    .link-button {
      font-size: 14px;
      padding: 10px 15px;
    }

    .link-button i {
      font-size: 18px;
      left: 15px;
    }
    }
    .special-button {
    background: #1a237e; /* Dark Blue background */
    color: white;        /* White text */
    }
  
  .special-button i {
    color: white;        /* White icon */
    }
  
  .special-button:hover {
    background: #0d1548; /* Slightly darker on hover */
    color: white;
    box-shadow: 0 8px 20px rgba(13, 21, 72, 0.6), 0 0 20px rgba(13, 21, 72, 0.4);
    }
  
  .special-button:hover i {
    color: white;
    }

</style>

</head>

<body>

  <div class="container">
    <div class="logo">
      <!-- Use a transparent PNG logo file here -->
      <img src="AXIS Logo.png" alt="Axis Migration Lawyers Logo">
    </div>


    <a class="link-button special-button" href="https://www.axislawgroup.com.au/" target="_blank">
      <i class="fas fa-globe"></i>
      Visit Our Website
    </a>
  
    <a class="link-button" href="https://www.google.com/search?q=Axis+Migration+Lawyers+NSW+Reviews" target="_blank">
      <i class="fas fa-star"></i>
      Leave Us a Google Review
    </a>

    <a class="link-button" href="https://www.instagram.com/axis_migration_lawyers_nsw_/" target="_blank">
      <i class="fab fa-instagram"></i>
      Follow Us on Instagram
    </a>

    <a class="link-button" href="https://www.facebook.com/people/Axis-Migration-Lawyers-NSW/61564211362230/" target="_blank">
      <i class="fab fa-facebook"></i>
      Like Us on Facebook
    </a>

    <a class="link-button" href="https://www.tiktok.com/@leelaraj49" target="_blank">
      <i class="fab fa-tiktok"></i>
      Follow Us on TikTok
    </a>

  </div>

</body>
</html>
