<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Axis Migration Lawyers</title>

  <!-- Load Lora font -->
  <link href="https://fonts.googleapis.com/css2?family=Lora&display=swap" rel="stylesheet">

  <!-- Load Font Awesome for icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: 'Lora', serif;
      background: linear-gradient(-45deg, #0d1548, #1a237e, #3949ab, #0d1548);
      background-size: 400% 400%;
      animation: gradientBG 20s ease infinite;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      width: 90%;
      max-width: 400px;
      background: rgba(255, 255, 255, 0.05);
      padding: 30px 20px;
      border-radius: 16px;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    .logo {
      width: 90px;
      height: 90px;
      background: white;
      border-radius: 50%;
      margin: 0 auto 20px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .logo img {
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    h1 {
      margin-bottom: 30px;
      font-size: 22px;
      color: #ffffff;
    }

    .link-button {
      position: relative;
      background: white;
      color: #1a237e;
      text-decoration: none;
      padding: 12px 20px;
      margin: 10px 0;
      width: 100%;
      min-height: 55px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      overflow: hidden;
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .link-button i {
      position: absolute;
      left: 20px;
      font-size: 20px;
      color: #1a237e;
    }

    .link-button:hover {
      background: #0d1548;
      color: white;
      transform: translateY(-3px);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
    }

    .link-button:hover i {
      color: white;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="logo">
      <!-- Your real AXIS logo -->
      <img src="AXIS Logo.jpg" alt="Axis Migration Lawyers Logo">
    </div>

    <h1>Axis Migration Lawyers</h1>

    <a class="link-button" href="https://www.google.com/search?q=Axis+Migration+Lawyers+NSW+Reviews" target="_blank">
      <i class="fas fa-star"></i>
      Leave Us a Google Review
    </a>

    <a class="link-button" href="https://www.instagram.com/axis_migration_lawyers_nsw_/" target="_blank">
      <i class="fab fa-instagram"></i>
      Follow Us on Instagram
    </a>

    <a class="link-button" href="https://www.facebook.com/people/Axis-Migration-Lawyers-NSW/61564211362230/" target="_blank">
      <i class="fab fa-facebook"></i>
      Like Us on Facebook
    </a>

    <a class="link-button" href="https://www.tiktok.com/@yourtiktokusername" target="_blank">
      <i class="fab fa-tiktok"></i>
      Follow Us on TikTok
    </a>

  </div>

</body>
</html>
